<div class="pagina">
    <h2>Usuarios registrados</h2>

    @if (error()) {
        <p class="error">{{ error()}}</p>
    }

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Usuario</th>
                <th>Rol</th>
            </tr>
        </thead>
        <tbody>
            @for (usuario of usuarios(); track usuario.id) {
                <tr>
                    <td>{{usuario.id}}</td>
                    <td>{{usuario.username}}</td>
                    <td>{{usuario.rol}}</td>
                </tr>
            } @empty {
                <tr>
                    <td colspan="3"> No hay Usuarios registrados</td>
                </tr>
            }
        </tbody>
    </table>
</div>
